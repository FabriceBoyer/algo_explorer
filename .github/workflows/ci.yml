name: Quality & Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Smoke-test production under repository base path
        run: |
          npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl --fail http://localhost:4173/${{ github.event.repository.name }}/ && break || sleep 1; done
          curl --fail http://localhost:4173/${{ github.event.repository.name }}/catalog.json -o /tmp/catalog.json
          node -e "const c=require('/tmp/catalog.json'); if(!c.repositories.length || !c.entries.length)process.exit(1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:8080/ && curl --fail http://127.0.0.1:8080/catalog.json -o /dev/null
      - run: docker compose down
        if: always()
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, docker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
