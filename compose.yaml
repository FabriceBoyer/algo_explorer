name: algo-explorer
services:
  web:
    build:
      context: .
      args:
        BASE_PATH: /
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
